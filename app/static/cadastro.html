<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Forja de Proxies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Mesma paleta e mesmas classes do entrar.html: as duas telas são o mesmo
     passo visto de lados diferentes, e o link entre elas não pode parecer
     que leva a outro site. -->
<style>
  :root{
    --bg:#0F0D17; --surface:#1B1730; --surface-2:#241F3D; --border:#382F5C;
    --text:#EDE6D6; --text-muted:#A79BC7; --inset:#16112A;
    --gold:#E9C765; --gold-light:#F5DC92; --sobre-gold:#1A1024;
    --purple:#8B6BFF; --red:#D9634A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 0%, rgba(139,107,255,0.12), transparent 42%),
      radial-gradient(circle at 88% 100%, rgba(233,199,101,0.10), transparent 42%),
      var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;
    display:grid;place-items:center;padding:20px;
  }
  input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  [hidden]{display:none !important;}

  .caixa{width:100%;max-width:380px;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;padding:26px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,.6);}
  .rune{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--gold),#B9913C);
    color:var(--sobre-gold);font-weight:700;margin-bottom:14px;}
  h1{font-family:'Cinzel',serif;font-size:21px;margin:0 0 4px;}
  .sub{color:var(--text-muted);font-size:13px;line-height:1.5;margin:0 0 20px;}
  label{display:block;font-size:12px;color:var(--text-muted);margin:0 0 5px;}
  .campo{width:100%;background:var(--inset);border:1px solid var(--border);
    border-radius:9px;color:var(--text);padding:10px 12px;font-size:14px;
    font-family:inherit;margin-bottom:13px;}
  .ajuda{font-size:12px;color:var(--text-muted);margin:-8px 0 13px;line-height:1.45;}
  .separa{border:none;border-top:1px solid var(--border);margin:4px 0 16px;}
  .btn{width:100%;background:linear-gradient(150deg,var(--gold),#C9A24B);
    color:var(--sobre-gold);border:none;border-radius:9px;padding:11px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn:disabled{opacity:.6;cursor:default;}
  .erro{background:rgba(217,99,74,.10);border:1px solid var(--red);
    border-radius:9px;padding:10px 12px;font-size:13px;color:#F0A899;
    margin-bottom:14px;line-height:1.45;}
  .rodape{margin:18px 0 0;font-size:12px;color:var(--text-muted);
    line-height:1.55;text-align:center;}
  .rodape a{color:var(--gold-light);}
</style>
</head>
<body>

<div class="caixa">
  <div class="rune"><span>⌘</span></div>
  <h1>Criar conta</h1>
  <p class="sub">Com a conta você monta baralhos e encontra todos eles em
    qualquer aparelho.</p>

  <div class="erro" id="erro" hidden></div>

  <form id="form">
    <label for="nome">Nome</label>
    <input class="campo" id="nome" autocomplete="name" maxlength="80" required>

    <label for="email">E-mail</label>
    <input class="campo" id="email" type="email" autocomplete="email"
           autocapitalize="none" spellcheck="false" required>
    <p class="ajuda">É com ele que você entra.</p>

    <label for="senha">Senha</label>
    <input class="campo" id="senha" type="password" autocomplete="new-password"
           minlength="8" required>

    <label for="confirmacao">Confirmação de senha</label>
    <input class="campo" id="confirmacao" type="password"
           autocomplete="new-password" minlength="8" required>

    <hr class="separa">

    <label for="token">Token de acesso</label>
    <!-- `autocomplete="off"`: o gerenciador de senhas oferece a senha da conta
         num campo sem nome reconhecível, e o token não é a senha de ninguém. -->
    <input class="campo" id="token" autocomplete="off" autocapitalize="none"
           spellcheck="false" required>
    <p class="ajuda">Peça ao dono do sistema.</p>

    <button class="btn" id="btn" type="submit">Criar conta</button>
  </form>

  <p class="rodape">Já tem conta? <a id="link-entrar" href="/entrar">Entrar</a><br>
    <a href="/">Voltar</a></p>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

/* Pra onde voltar depois de criar a conta. A mesma regra do entrar.html: só
   caminho relativo, senão o `?voltar=` vira redirecionamento aberto. */
function destino(){
  const bruto = new URLSearchParams(location.search).get("voltar") || "";
  return /^\/[^/\\]/.test(bruto) ? bruto : "/";
}

// O "Entrar" leva o mesmo destino: quem descobre aqui que já tinha conta
// não pode perder o caminho de volta pro deck que estava abrindo.
$("link-entrar").href = "/entrar?voltar=" + encodeURIComponent(destino());

function mostrarErro(msg){
  $("erro").textContent = msg;
  $("erro").hidden = !msg;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  mostrarErro("");
  // Conferida aqui também, e não só no servidor: a senha digitada duas vezes
  // errada é o erro mais comum desta tela, e ele não precisa de rede.
  if ($("senha").value !== $("confirmacao").value){
    mostrarErro("A confirmação não é igual à senha.");
    $("confirmacao").value = "";
    $("confirmacao").focus();
    return;
  }
  $("btn").disabled = true;
  $("btn").textContent = "Criando…";
  try {
    const r = await fetch("/conta/criar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        nome: $("nome").value,
        email: $("email").value,
        senha: $("senha").value,
        confirmacao: $("confirmacao").value,
        token: $("token").value,
      }),
    });
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.detail || `Erro ${r.status}`);
    location.href = destino();
    return;   // não reabilita o botão: a página está indo embora
  } catch (err){
    mostrarErro(err.message);
  }
  $("btn").disabled = false;
  $("btn").textContent = "Criar conta";
});

/* Já logado? Então esta tela não tem o que fazer. */
(async () => {
  try {
    const r = await fetch("/conta", {cache: "no-store"});
    const dados = await r.json();
    if (dados.usuario) location.replace(destino());
  } catch (e){ /* sem rede, fica na tela */ }
})();

$("nome").focus();
</script>
</body>
</html>
